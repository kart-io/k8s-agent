apiVersion: v1
kind: Pod
metadata:
  name: crashloop-test-pod
  namespace: default
  labels:
    app: test-orchestrator
    test-type: crash
spec:
  restartPolicy: Always
  containers:
  - name: crash-container
    image: busybox:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Starting container..."
      echo "This container will crash to trigger orchestrator-service"
      sleep 3
      exit 1
