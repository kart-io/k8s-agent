name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v2.5.0'
  BUF_VERSION: '1.28.1'

jobs:
  # Code quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
            sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: make go.lint

  # Go format check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          make go.fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Run 'make go.fmt' locally."
            git diff
            exit 1
          fi

  # Go vet check
  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: make go.vet

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: make go.test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: _output/coverage/*.out
          flags: unittests
          name: codecov-umbrella

  # Proto linting
  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v${{ env.BUF_VERSION }}

      - name: Run proto lint
        run: make proto.lint

  # Build check
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make go.build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: _output/bin/*
          retention-days: 7

  # Integration tests (optional - run if test/integration exists)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, vet, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start dependencies
        run: |
          cd deployments/docker-compose
          docker-compose up -d mysql redis nats

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker-compose -f deployments/docker-compose/docker-compose.yaml exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done'

      - name: Run integration tests
        run: make go.test.integration

      - name: Stop dependencies
        if: always()
        run: |
          cd deployments/docker-compose
          docker-compose down -v
