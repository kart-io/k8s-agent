version: '3.8'

services:
  # Traefik 网关
  traefik:
    image: traefik:v2.11
    container_name: k8s-agent-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
      - traefik-certs:/letsencrypt
    networks:
      - k8s-agent-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=traefik"

  # Redis (用于限流和缓存)
  redis:
    image: redis:7-alpine
    container_name: k8s-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - k8s-agent-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL (用于认证服务)
  postgres:
    image: postgres:15-alpine
    container_name: k8s-agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8s_agent_auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - k8s-agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Gateway Service (可选，如果使用 Go 网关)
  gateway-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: k8s-agent-gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../configs:/app/configs:ro
      - gateway-logs:/app/logs
    networks:
      - k8s-agent-network
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/`)"
      - "traefik.http.routers.gateway.entrypoints=web,websecure"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"

  # Auth Service
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    container_name: k8s-agent-auth
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=k8s_agent_auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - k8s-agent-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=false"  # 由 Traefik 路由配置管理

  # Agent Manager
  agent-manager:
    build:
      context: ../../agent-manager
      dockerfile: Dockerfile
    container_name: k8s-agent-manager
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - NATS_URL=nats://nats:4222
    networks:
      - k8s-agent-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # Orchestrator Service
  orchestrator-service:
    build:
      context: ../../orchestrator-service
      dockerfile: Dockerfile
    container_name: k8s-agent-orchestrator
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - k8s-agent-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # Prometheus (监控)
  prometheus:
    image: prom/prometheus:latest
    container_name: k8s-agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - k8s-agent-network

  # Grafana (可视化)
  grafana:
    image: grafana/grafana:latest
    container_name: k8s-agent-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - k8s-agent-network
    depends_on:
      - prometheus

networks:
  k8s-agent-network:
    driver: bridge
    name: k8s-agent-network

volumes:
  traefik-logs:
    name: k8s-agent-traefik-logs
  traefik-certs:
    name: k8s-agent-traefik-certs
  redis-data:
    name: k8s-agent-redis-data
  postgres-data:
    name: k8s-agent-postgres-data
  gateway-logs:
    name: k8s-agent-gateway-logs
  prometheus-data:
    name: k8s-agent-prometheus-data
  grafana-data:
    name: k8s-agent-grafana-data
