// common/error/v1/error.proto
// 错误处理通用消息定义

syntax = "proto3";

package common.error.v1;

option go_package = "github.com/kart-io/k8s-agent/pkg/api/common/error/v1;errorv1";

// 错误详情
message Error {
  // 错误代码
  int32 code = 1;

  // 错误原因（机器可读）
  string reason = 2;

  // 错误消息（人类可读）
  string message = 3;

  // 错误元数据
  map<string, string> metadata = 4;

  // 错误堆栈（调试用）
  repeated string stack = 5;
}

// 错误响应
message ErrorResponse {
  // 错误信息
  Error error = 1;

  // 请求 ID
  string request_id = 2;

  // 时间戳
  int64 timestamp = 3;
}
