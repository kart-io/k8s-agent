# Auth Service Local Development Configuration (Docker/Local MySQL)

server:
  host: "0.0.0.0"
  port: 8090
  mode: "debug"
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "root123"
  database: "user_auth"  # 修改为 database 而不是 dbname
  charset: "utf8mb4"
  parse_time: true
  max_idle_conns: 5
  max_open_conns: 25

redis:
  host: "localhost"
  port: 6379
  password: "redis_pass"  # 添加 Redis 密码
  db: 0
  pool_size: 10

jwt:
  secret: "local-dev-secret-key-not-for-production"
  expires_hours: 24

logging:
  engine: "zap"
  level: "debug"
  format: "text"
  output: "stdout"
  otlp:
    enabled: false
    endpoint: "http://localhost:4317"
    insecure: true

# Email notification configuration for forced logout
email:
  enabled: false # Set true when SMTP configured
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_user: "notifications@example.com"
  smtp_password: ""
  from_address: "noreply@k8s-agent.com"
  from_name: "K8s Agent Security"
  template_dir: "templates/email"
