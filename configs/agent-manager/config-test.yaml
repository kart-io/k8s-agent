# Agent Manager Service Test Configuration

# HTTP server configuration
server:
  host: "0.0.0.0"
  port: 8080
  mode: "test"  # test mode
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  graceful_stop: 10s

# gRPC server configuration
grpc:
  enable: true
  host: "0.0.0.0"
  port: 9090
  max_recv_msg_size: 10485760       # 10MB
  max_send_msg_size: 10485760       # 10MB
  connection_timeout: 60s
  keep_alive_time: 30s
  keep_alive_timeout: 10s
  max_connection_idle: 180s
  max_connection_age: 900s
  max_connection_age_grace: 5s
  enable_reflection: false          # Disable for test
  enable_health_check: true

# Database configuration (MySQL)
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "root123"
  database: "agent_manager"  # Use same database for now
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  auto_migrate: true

# Redis configuration
redis:
  addr: "localhost:6379"
  password: "redis_pass"
  db: 1  # Use different DB for test
  pool_size: 5
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# NATS configuration
nats:
  url: "nats://localhost:4222"
  cluster_id: "agent-manager-cluster-test"
  max_reconnect: 5
  reconnect_wait: 2s
  ping_interval: 20s
  max_pings_out: 2
  enable_jetstream: false
  reconnect_buf_size: 1048576

# Logging configuration
logging:
  level: "info"  # Info level for test
  format: "json"  # JSON format for parsing
  output:
    - "stdout"
  engine: "zap"
  development: false
  enable_caller: true
  otlp_endpoint: ""
  otlp_insecure: false

# Metrics configuration
metrics:
  enabled: false  # Disable metrics for test
  path: "/metrics"
  port: 9091
  retention_days: 1
  aggregation_interval: 1m