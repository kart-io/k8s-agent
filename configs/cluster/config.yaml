# Cluster Service Configuration

server:
  port: 8082
  mode: debug  # debug, release, test
  read_timeout: 10s
  write_timeout: 10s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: cluster_db  # Changed from 'dbname' to 'database'
  ssl_mode: disable  # Changed from 'sslmode' to 'ssl_mode' to match DatabaseOptions
  max_open_conns: 25
  max_idle_conns: 5

jwt:
  secret: your-secret-key-change-in-production

logging:
  level: info  # debug, info, warn, error
  format: json  # json, text
