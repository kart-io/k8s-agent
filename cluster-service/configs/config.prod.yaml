# Production Configuration

server:
  port: 8082
  mode: release
  read_timeout: 10s
  write_timeout: 10s

database:
  host: postgres
  port: 5432
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  dbname: cluster_production
  sslmode: require
  max_open_conns: 50
  max_idle_conns: 10

jwt:
  secret: ${JWT_SECRET}

logging:
  level: info
  format: json
