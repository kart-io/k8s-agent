version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: cluster-service-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cluster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cluster-network

  cluster-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cluster-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cluster_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cluster-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  cluster-network:
    driver: bridge
