{
  "analytics_storage_type": "redis",
  "analytics_storage_config": {
    "type": "redis",
    "host": "redis",
    "port": 6379,
    "hosts": null,
    "username": "",
    "password": "",
    "database": 0,
    "optimisation_max_idle": 100,
    "optimisation_max_active": 0,
    "enable_cluster": false,
    "redis_use_ssl": false,
    "redis_ssl_insecure_skip_verify": false
  },
  "purge_delay": 2,
  "purge_chunk": 100,
  "pumps": {
    "postgres": {
      "type": "postgres",
      "meta": {
        "type": "postgres",
        "connection_string": "host=postgres port=5432 user=tyk password=tykpass dbname=tyk_analytics sslmode=disable",
        "table_sharding": false
      }
    },
    "stdout": {
      "type": "stdout",
      "meta": {
        "log_field_name": "tyk-analytics-record",
        "format": "json"
      }
    },
    "prometheus": {
      "type": "prometheus",
      "meta": {
        "listen_address": ":9090",
        "path": "/metrics"
      }
    }
  },
  "uptime_pump_config": {
    "collection_name": "tyk_uptime_analytics",
    "mongo_url": "",
    "max_insert_batch_size_bytes": 10485760,
    "max_document_size_bytes": 10485760
  },
  "dont_purge_uptime_data": false,
  "statsd_connection_string": "",
  "statsd_prefix": ""
}
