apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

labels:
  - pairs:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik
      app.kubernetes.io/component: ingress-controller
