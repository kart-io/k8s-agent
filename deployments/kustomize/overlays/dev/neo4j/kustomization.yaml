apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aetherius-dev

resources:
- ../../../base/neo4j

secretGenerator:
- name: neo4j-secret
  literals:
  - auth=neo4j/dev-neo4j-password

patches:
- path: statefulset-patch.yaml
- path: service-patch.yaml

labels:
- pairs:
    environment: development
