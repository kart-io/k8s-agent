apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    # NATS Server Configuration for Aetherius (Development - Simplified)

    # Client port
    port: 4222

    # HTTP monitoring port
    http_port: 8222

    # Logging
    debug: true
    trace: false
    logtime: true

    # Limits
    max_connections: 1000
    max_subscriptions: 10000
    max_payload: 1048576  # 1MB

    # JetStream (for persistence)
    jetstream {
      store_dir: "/data/jetstream"
    }
