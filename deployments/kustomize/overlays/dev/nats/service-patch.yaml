apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  type: NodePort
  ports:
  - name: client
    port: 4222
    targetPort: 4222
    protocol: TCP
    nodePort: 30422
  - name: cluster
    port: 6222
    targetPort: 6222
    protocol: TCP
    nodePort: 30622
  - name: monitor
    port: 8222
    targetPort: 8222
    protocol: TCP
    nodePort: 30822
