apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aetherius-prod

resources:
- ../../../base/neo4j

secretGenerator:
- name: neo4j-secret
  literals:
  - auth=neo4j/CHANGE_ME_IN_PRODUCTION  # 生产环境必须修改此密码

patches:
- path: statefulset-patch.yaml

labels:
- pairs:
    environment: production
