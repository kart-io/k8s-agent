apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    # NATS Server Configuration for Aetherius Production

    # Server name
    server_name: $POD_NAME

    # Client port
    port: 4222

    # HTTP monitoring port
    http_port: 8222

    # Cluster configuration for HA
    cluster {
      port: 6222

      # Cluster routes for 3-node setup
      routes = [
        nats://nats-0.nats-headless.aetherius-prod.svc.cluster.local:6222
        nats://nats-1.nats-headless.aetherius-prod.svc.cluster.local:6222
        nats://nats-2.nats-headless.aetherius-prod.svc.cluster.local:6222
      ]
    }

    # Logging
    debug: false
    trace: false
    logtime: true
    log_file: "/data/nats.log"

    # Limits (production values)
    max_connections: 5000
    max_subscriptions: 50000
    max_payload: 1048576  # 1MB
    max_pending: 268435456  # 256MB

    # Connection timeouts
    ping_interval: "2m"
    ping_max: 3
    write_deadline: "10s"

    # JetStream (for persistence)
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    # System account for monitoring
    system_account: SYS
