apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aetherius-prod

resources:
- ../../../base/redis

secretGenerator:
- name: redis-secret
  literals:
  - password=CHANGE_ME_IN_PRODUCTION  # 生产环境必须修改此密码

patches:
- path: deployment-patch.yaml

labels:
- pairs:
    environment: production
