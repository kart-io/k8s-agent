apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aetherius-prod

resources:
- ../../../base/postgres

secretGenerator:
- name: postgres-secret
  literals:
  - username=postgres
  - password=CHANGE_ME_IN_PRODUCTION  # 生产环境必须修改此密码

patches:
- path: deployment-patch.yaml
- path: pvc-patch.yaml

labels:
- pairs:
    environment: production
