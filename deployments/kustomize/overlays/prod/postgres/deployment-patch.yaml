apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
      - name: postgres
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        # 生产环境配置优化
        - name: POSTGRES_SHARED_BUFFERS
          value: "512MB"
        - name: POSTGRES_MAX_CONNECTIONS
          value: "200"
        - name: POSTGRES_WORK_MEM
          value: "16MB"
