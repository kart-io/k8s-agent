apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
    component: database
data:
  01-init-database.sql: |
    -- Create databases for different services
    CREATE DATABASE IF NOT EXISTS agent_manager;
    CREATE DATABASE IF NOT EXISTS orchestrator;

    -- Create extensions
    \c aetherius;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";

    \c agent_manager;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    \c orchestrator;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  02-create-users.sql: |
    -- Create service users (if needed)
    -- Uncomment and customize for production

    -- CREATE USER agent_manager_user WITH PASSWORD 'changeme';
    -- GRANT ALL PRIVILEGES ON DATABASE agent_manager TO agent_manager_user;

    -- CREATE USER orchestrator_user WITH PASSWORD 'changeme';
    -- GRANT ALL PRIVILEGES ON DATABASE orchestrator TO orchestrator_user;

  postgresql.conf: |
    # PostgreSQL configuration optimizations

    # Connection settings
    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB

    # Write ahead log
    wal_buffers = 16MB
    max_wal_size = 1GB
    min_wal_size = 80MB

    # Query tuning
    random_page_cost = 1.1
    effective_io_concurrency = 200

    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_line_prefix = '%m [%p] %q%u@%d '
    log_timezone = 'UTC'

    # Statistics
    track_activity_query_size = 2048
    track_io_timing = on
