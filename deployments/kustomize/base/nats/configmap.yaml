apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app: nats
    component: message-queue
data:
  nats.conf: |
    # NATS Server Configuration for Aetherius - Simplified

    # Server name
    server_name: $POD_NAME

    # Client port
    port: 4222

    # HTTP monitoring port
    http_port: 8222

    # Cluster port
    cluster {
      name: aetherius-cluster
      port: 6222
    }

    # Logging
    debug: false
    trace: false
    logtime: true

    # Limits
    max_connections: 1000
    max_subscriptions: 10000
    max_payload: 1048576  # 1MB
    max_pending: 67108864  # 64MB

    # Connection timeouts
    ping_interval: "2m"
    ping_max: 2
    write_deadline: "10s"
