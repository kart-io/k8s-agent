apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
    component: message-queue
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 4222
    targetPort: 4222
    protocol: TCP
  - name: cluster
    port: 6222
    targetPort: 6222
    protocol: TCP
  - name: monitor
    port: 8222
    targetPort: 8222
    protocol: TCP
  selector:
    app: nats
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app: nats
    component: message-queue
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: client
    port: 4222
    targetPort: 4222
    protocol: TCP
  - name: cluster
    port: 6222
    targetPort: 6222
    protocol: TCP
  - name: monitor
    port: 8222
    targetPort: 8222
    protocol: TCP
  selector:
    app: nats
