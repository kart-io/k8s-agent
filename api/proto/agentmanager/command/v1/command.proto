syntax = "proto3";

package agentmanager.command.v1;

option go_package = "github.com/kart-io/k8s-agent/protos/gen/agentmanager/command/v1;commandv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// CommandService 命令管理服务
service CommandService {
  // ExecuteCommand 执行命令
  rpc ExecuteCommand(ExecuteCommandRequest) returns (Command) {
    option (google.api.http) = {
      post: "/api/v1/grpc/commands/execute"
      body: "*"
    };
  }

  // GetCommand 获取命令详情
  rpc GetCommand(GetCommandRequest) returns (Command) {
    option (google.api.http) = {
      get: "/api/v1/grpc/commands/{command_id}"
    };
  }

  // ListCommands 列出命令
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse) {
    option (google.api.http) = {
      get: "/api/v1/grpc/commands"
    };
  }

  // CancelCommand 取消命令
  rpc CancelCommand(CancelCommandRequest) returns (Command) {
    option (google.api.http) = {
      post: "/api/v1/grpc/commands/{command_id}/cancel"
      body: "*"
    };
  }

  // GetCommandResult 获取命令结果
  rpc GetCommandResult(GetCommandResultRequest) returns (CommandResult) {
    option (google.api.http) = {
      get: "/api/v1/grpc/commands/{command_id}/result"
    };
  }

  // StreamCommandOutput 流式获取命令输出
  rpc StreamCommandOutput(StreamCommandOutputRequest) returns (stream CommandOutput) {}
}

// Command 命令信息
message Command {
  // command_id 命令 ID
  string command_id = 1;

  // agent_id Agent ID
  string agent_id = 2;

  // cluster_id 集群 ID
  string cluster_id = 3;

  // type 命令类型
  CommandType type = 4;

  // tool 工具名称
  string tool = 5;

  // action 操作
  string action = 6;

  // args 参数列表
  repeated string args = 7;

  // timeout 超时时间
  google.protobuf.Duration timeout = 8;

  // status 命令状态
  CommandStatus status = 9;

  // created_at 创建时间
  google.protobuf.Timestamp created_at = 10;

  // started_at 开始时间
  google.protobuf.Timestamp started_at = 11;

  // completed_at 完成时间
  google.protobuf.Timestamp completed_at = 12;

  // metadata 元数据
  map<string, string> metadata = 13;
}

// CommandType 命令类型
enum CommandType {
  // COMMAND_TYPE_UNSPECIFIED 未指定
  COMMAND_TYPE_UNSPECIFIED = 0;
  // COMMAND_TYPE_DIAGNOSTIC 诊断命令
  COMMAND_TYPE_DIAGNOSTIC = 1;
  // COMMAND_TYPE_REMEDIATION 修复命令
  COMMAND_TYPE_REMEDIATION = 2;
  // COMMAND_TYPE_QUERY 查询命令
  COMMAND_TYPE_QUERY = 3;
}

// CommandStatus 命令状态
enum CommandStatus {
  // COMMAND_STATUS_UNSPECIFIED 未指定
  COMMAND_STATUS_UNSPECIFIED = 0;
  // COMMAND_STATUS_PENDING 等待中
  COMMAND_STATUS_PENDING = 1;
  // COMMAND_STATUS_RUNNING 运行中
  COMMAND_STATUS_RUNNING = 2;
  // COMMAND_STATUS_COMPLETED 已完成
  COMMAND_STATUS_COMPLETED = 3;
  // COMMAND_STATUS_FAILED 失败
  COMMAND_STATUS_FAILED = 4;
  // COMMAND_STATUS_CANCELLED 已取消
  COMMAND_STATUS_CANCELLED = 5;
  // COMMAND_STATUS_TIMEOUT 超时
  COMMAND_STATUS_TIMEOUT = 6;
}

// ExecuteCommandRequest 执行命令请求
message ExecuteCommandRequest {
  // cluster_id 集群 ID
  string cluster_id = 1;

  // type 命令类型
  CommandType type = 2;

  // tool 工具名称
  string tool = 3;

  // action 操作
  string action = 4;

  // args 参数列表
  repeated string args = 5;

  // timeout 超时时间
  google.protobuf.Duration timeout = 6;

  // metadata 元数据
  map<string, string> metadata = 7;
}

// GetCommandRequest 获取命令请求
message GetCommandRequest {
  // command_id 命令 ID
  string command_id = 1;
}

// ListCommandsRequest 列出命令请求
message ListCommandsRequest {
  // cluster_id 集群 ID 过滤
  string cluster_id = 1;

  // agent_id Agent ID 过滤
  string agent_id = 2;

  // status 状态过滤
  CommandStatus status = 3;

  // page_size 每页数量
  int32 page_size = 4;

  // page_token 分页标记
  string page_token = 5;
}

// ListCommandsResponse 列出命令响应
message ListCommandsResponse {
  // commands 命令列表
  repeated Command commands = 1;

  // next_page_token 下一页标记
  string next_page_token = 2;

  // total_count 总数
  int32 total_count = 3;
}

// CancelCommandRequest 取消命令请求
message CancelCommandRequest {
  // command_id 命令 ID
  string command_id = 1;
}

// GetCommandResultRequest 获取命令结果请求
message GetCommandResultRequest {
  // command_id 命令 ID
  string command_id = 1;
}

// CommandResult 命令结果
message CommandResult {
  // command_id 命令 ID
  string command_id = 1;

  // status 命令状态
  CommandStatus status = 2;

  // exit_code 退出码
  int32 exit_code = 3;

  // stdout 标准输出
  string stdout = 4;

  // stderr 标准错误
  string stderr = 5;

  // error 错误信息
  string error = 6;

  // duration 执行时长
  google.protobuf.Duration duration = 7;

  // completed_at 完成时间
  google.protobuf.Timestamp completed_at = 8;
}

// StreamCommandOutputRequest 流式输出请求
message StreamCommandOutputRequest {
  // command_id 命令 ID
  string command_id = 1;
}

// CommandOutput 命令输出
message CommandOutput {
  // command_id 命令 ID
  string command_id = 1;

  // timestamp 时间戳
  google.protobuf.Timestamp timestamp = 2;

  // stream 输出流类型
  OutputStream stream = 3;

  // data 输出数据
  string data = 4;
}

// OutputStream 输出流类型
enum OutputStream {
  // OUTPUT_STREAM_UNSPECIFIED 未指定
  OUTPUT_STREAM_UNSPECIFIED = 0;
  // OUTPUT_STREAM_STDOUT 标准输出
  OUTPUT_STREAM_STDOUT = 1;
  // OUTPUT_STREAM_STDERR 标准错误
  OUTPUT_STREAM_STDERR = 2;
}
