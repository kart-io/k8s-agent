syntax = "proto3";

package agentmanager.event.v1;

option go_package = "github.com/kart-io/k8s-agent/protos/gen/agentmanager/event/v1;eventv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// EventService 事件管理服务
service EventService {
  // ListEvents 列出事件
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/grpc/events"
    };
  }

  // GetEvent 获取事件详情
  rpc GetEvent(GetEventRequest) returns (Event) {
    option (google.api.http) = {
      get: "/api/v1/grpc/events/{event_id}"
    };
  }

  // SearchEvents 搜索事件
  rpc SearchEvents(SearchEventsRequest) returns (SearchEventsResponse) {
    option (google.api.http) = {
      post: "/api/v1/grpc/events/search"
      body: "*"
    };
  }

  // SubscribeEvents 订阅事件流
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event) {}

  // PublishEvent 发布事件（内部使用）
  rpc PublishEvent(PublishEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/api/v1/grpc/events/publish"
      body: "*"
    };
  }
}

// Event 事件信息
message Event {
  // event_id 事件 ID
  string event_id = 1;

  // agent_id Agent ID
  string agent_id = 2;

  // cluster_id 集群 ID
  string cluster_id = 3;

  // namespace 命名空间
  string namespace = 4;

  // resource_type 资源类型
  string resource_type = 5;

  // resource_name 资源名称
  string resource_name = 6;

  // event_type 事件类型
  string event_type = 7;

  // severity 严重性
  EventSeverity severity = 8;

  // message 消息
  string message = 9;

  // reason 原因
  string reason = 10;

  // source 来源
  EventSource source = 11;

  // first_timestamp 首次发生时间
  google.protobuf.Timestamp first_timestamp = 12;

  // last_timestamp 最后发生时间
  google.protobuf.Timestamp last_timestamp = 13;

  // count 发生次数
  int32 count = 14;

  // metadata 元数据
  google.protobuf.Struct metadata = 15;

  // labels 标签
  map<string, string> labels = 16;
}

// EventSeverity 事件严重性
enum EventSeverity {
  // EVENT_SEVERITY_UNSPECIFIED 未指定
  EVENT_SEVERITY_UNSPECIFIED = 0;
  // EVENT_SEVERITY_INFO 信息
  EVENT_SEVERITY_INFO = 1;
  // EVENT_SEVERITY_WARNING 警告
  EVENT_SEVERITY_WARNING = 2;
  // EVENT_SEVERITY_ERROR 错误
  EVENT_SEVERITY_ERROR = 3;
  // EVENT_SEVERITY_CRITICAL 严重
  EVENT_SEVERITY_CRITICAL = 4;
}

// EventSource 事件来源
message EventSource {
  // component 组件名称
  string component = 1;

  // host 主机
  string host = 2;
}

// ListEventsRequest 列出事件请求
message ListEventsRequest {
  // cluster_id 集群 ID 过滤
  string cluster_id = 1;

  // namespace 命名空间过滤
  string namespace = 2;

  // severity 严重性过滤
  EventSeverity severity = 3;

  // resource_type 资源类型过滤
  string resource_type = 4;

  // page_size 每页数量
  int32 page_size = 5;

  // page_token 分页标记
  string page_token = 6;
}

// ListEventsResponse 列出事件响应
message ListEventsResponse {
  // events 事件列表
  repeated Event events = 1;

  // next_page_token 下一页标记
  string next_page_token = 2;

  // total_count 总数
  int32 total_count = 3;
}

// GetEventRequest 获取事件请求
message GetEventRequest {
  // event_id 事件 ID
  string event_id = 1;
}

// SearchEventsRequest 搜索事件请求
message SearchEventsRequest {
  // cluster_id 集群 ID
  string cluster_id = 1;

  // namespace 命名空间
  string namespace = 2;

  // severity 严重性
  EventSeverity severity = 3;

  // resource_type 资源类型
  string resource_type = 4;

  // start_time 开始时间
  google.protobuf.Timestamp start_time = 5;

  // end_time 结束时间
  google.protobuf.Timestamp end_time = 6;

  // keywords 关键词搜索
  repeated string keywords = 7;

  // page_size 每页数量
  int32 page_size = 8;

  // page_token 分页标记
  string page_token = 9;
}

// SearchEventsResponse 搜索事件响应
message SearchEventsResponse {
  // events 事件列表
  repeated Event events = 1;

  // next_page_token 下一页标记
  string next_page_token = 2;

  // total_count 总数
  int32 total_count = 3;
}

// SubscribeEventsRequest 订阅事件请求
message SubscribeEventsRequest {
  // cluster_id 集群 ID 过滤
  string cluster_id = 1;

  // namespace 命名空间过滤
  string namespace = 2;

  // severity 严重性过滤
  EventSeverity severity = 3;

  // resource_types 资源类型过滤
  repeated string resource_types = 4;
}

// PublishEventRequest 发布事件请求
message PublishEventRequest {
  // event 事件信息（不包含 event_id）
  Event event = 1;
}
