syntax = "proto3";

package common.example.v1;

option go_package = "github.com/kart-io/k8s-agent/protos/gen/common/example/v1;examplev1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// ExampleService 示例服务 - 演示如何定义和使用 gRPC 服务
service ExampleService {
  // GetVersion 获取服务版本信息
  rpc GetVersion(google.protobuf.Empty) returns (VersionResponse) {
    option (google.api.http) = {
      get: "/api/v1/version"
    };
  }

  // Echo 回显消息
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/api/v1/echo"
      body: "*"
    };
  }

  // StreamEcho 流式回显消息
  rpc StreamEcho(stream EchoRequest) returns (stream EchoResponse) {}
}

// VersionResponse 版本响应
message VersionResponse {
  // version 版本号
  string version = 1;

  // build_time 构建时间
  string build_time = 2;

  // git_commit Git 提交哈希
  string git_commit = 3;
}

// EchoRequest 回显请求
message EchoRequest {
  // message 消息内容
  string message = 1;
}

// EchoResponse 回显响应
message EchoResponse {
  // message 消息内容
  string message = 1;

  // timestamp 响应时间戳
  int64 timestamp = 2;
}
