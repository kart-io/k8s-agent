# Agent Manager Service Configuration

# HTTP server configuration
server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"  # debug, release, test
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  graceful_stop: 30s

# Database configuration (MySQL)
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
  database: "agent_manager"
  ssl_mode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h
  auto_migrate: true

# Redis configuration
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# NATS configuration
nats:
  url: "nats://localhost:4222"
  cluster_id: "agent-manager-cluster"
  max_reconnect: 10
  reconnect_wait: 2s
  ping_interval: 20s
  max_pings_out: 2
  enable_jetstream: false
  reconnect_buf_size: 1048576

# Logging configuration
logging:
  level: "info"  # debug, info, warn, error, fatal
  format: "json"  # json, text
  output:
    - "stdout"
  engine: "zap"  # zap, slog
  development: false
  enable_caller: true
  otlp_endpoint: ""
  otlp_insecure: false

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"
  port: 9090
  retention_days: 30
  aggregation_interval: 1m