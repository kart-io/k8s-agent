# Aetherius Agent Manager Configuration - Development

# HTTP server configuration
server:
  host: "0.0.0.0"
  port: 8084
  read_timeout: 30s
  write_timeout: 30s
  graceful_stop: 10s

# NATS configuration
nats:
  url: "nats://localhost:4222"
  cluster_id: "aetherius-cluster"
  max_reconnect: -1  # Unlimited retries
  reconnect_wait: 2s
  ping_interval: 20s
  max_pings_out: 3
  enable_jetstream: false

# Database configuration (MySQL)
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "root123"
  database: "agent_manager"
  ssl_mode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h
  auto_migrate: true

# Redis configuration
redis:
  addr: "localhost:6379"
  password: "dev-redis-password"
  db: 1  # Use different DB for dev
  pool_size: 10
  min_idle_conns: 3
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# Logging configuration
logging:
  level: "debug"  # debug, info, warn, error
  format: "console"  # json, console
  output_path: "stdout"  # stdout, stderr, or file path

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"
  port: 8080
